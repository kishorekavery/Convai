services:
  convai-app:
    image: convai-app:latest
    container_name: convai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Async uvicorn workers. Raise only alongside the connection budget:
      #   WEB_CONCURRENCY x (active tenants + 1) x DB_MAX_CONN <= max_connections
      # Each worker keeps its own pagination / schema / embedding caches, so
      # follow-up pagination succeeds only ~1 time in N at N workers. Keep this
      # at 1 until the query cache is shared (Redis) or sessions are sticky.
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - DB_MIN_CONN=${DB_MIN_CONN:-0}
      - DB_MAX_CONN=${DB_MAX_CONN:-4}
    volumes:
      - ./logs:/app/logs
    restart: always

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: arize-phoenix
    ports:
      - "6006:6006"   # Phoenix UI & HTTP
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - PHOENIX_ENABLE_AUTH=true
      # Set PHOENIX_SECRET and PHOENIX_ADMIN_PASSWORD in .env - the defaults
      # below are placeholders and must not be used outside local development.
      - PHOENIX_SECRET=${PHOENIX_SECRET:-changeme}
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${PHOENIX_ADMIN_PASSWORD:-changeme}
      - PHOENIX_SQL_DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME:-askailogs}
    restart: unless-stopped
