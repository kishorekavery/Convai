services:
  convai-app:
    # Pinned, not :latest - otherwise "what is actually running" is unanswerable
    # and a rollback has nothing to roll back to. Roll back with
    #   APP_VERSION=v9 docker compose up -d
    # Full Docker Hub name so `docker compose pull` works directly; there is no
    # local retagging step.
    image: kishore710/convai-app:${APP_VERSION:-v10}
    container_name: convai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Async uvicorn workers. Raise only alongside the connection budget:
      #   WEB_CONCURRENCY x (active tenants + 1) x DB_MAX_CONN <= max_connections
      # Each worker keeps its own pagination / schema / embedding caches, so
      # follow-up pagination succeeds only ~1 time in N at N workers. Keep this
      # at 1 until the query cache is shared (Redis) or sessions are sticky.
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - DB_MIN_CONN=${DB_MIN_CONN:-0}
      - DB_MAX_CONN=${DB_MAX_CONN:-4}
      # Rotation of the application's OWN log file under ./logs. The json-file
      # driver below does not touch this - it only rotates what Docker captures
      # from stdout, whereas the app writes ./logs/application.log directly
      # through the bind mount.
      # Worst case on disk: LOG_MAX_BYTES x (LOG_BACKUP_COUNT + 1) ~= 550 MB.
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-52428800}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Readiness probe budget. Keep well below the load balancer's probe
      # interval: a probe that hangs is as bad as one that fails, because the
      # balancer keeps sending traffic while it waits.
      - READINESS_TIMEOUT_SECONDS=${READINESS_TIMEOUT_SECONDS:-3}
    volumes:
      - ./logs:/app/logs
    # Rotation of the container's stdout/stderr as captured by Docker. Without
    # this the json-file driver grows without limit until the disk fills.
    # Caps at max-size x max-file = 90 MB.
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    restart: always

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: arize-phoenix
    ports:
      - "6006:6006"   # Phoenix UI & HTTP
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - PHOENIX_ENABLE_AUTH=true
      # Set PHOENIX_SECRET and PHOENIX_ADMIN_PASSWORD in .env - the defaults
      # below are placeholders and must not be used outside local development.
      - PHOENIX_SECRET=${PHOENIX_SECRET:-changeme}
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${PHOENIX_ADMIN_PASSWORD:-changeme}
      - PHOENIX_SQL_DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME:-askailogs}
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    restart: unless-stopped
