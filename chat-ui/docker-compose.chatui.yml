# Standalone compose file for the chat UI.
#
# Deliberately separate from the application's docker-compose.yml: nothing in
# the main project changes, and removing this directory removes the UI
# completely.
#
# It joins the application's existing network as an external network, which is
# how nginx can reach the API by service name (convai-app) while the browser
# only ever sees this one origin - so the backend needs no CORS middleware.
#
#   docker compose -f docker-compose.chatui.yml up -d --build
#
# Serves on host port 3001 by default (8080 is taken by Jenkins).
#
# If your application stack uses a different network name, override it:
#   CONVAI_NETWORK=<name> docker compose -f docker-compose.chatui.yml up -d
# Find it with:  docker inspect convai-service -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'

services:
  chat-ui:
    build: .
    image: convai-chat-ui:latest
    container_name: convai-chat-ui
    ports:
      - "${CHAT_UI_PORT:-3001}:80"
    volumes:
      # Runtime config: edit and reload the page, no rebuild.
      - ./public/config.json:/usr/share/nginx/html/config.json:ro
    networks:
      - convai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  convai:
    external: true
    name: ${CONVAI_NETWORK:-conv-ai_default}
