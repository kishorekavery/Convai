server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # config.json is runtime configuration, not part of the bundle - so the
    # tenant, user and facility list can be changed by editing the mounted file
    # and reloading, without rebuilding the image.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API, reverse-proxied under the SAME ORIGIN as the UI. This is the
    # whole reason no CORS middleware is needed on the backend: the browser
    # only ever talks to this server.
    location /convai/ {
        proxy_pass http://convai-app:8000/convai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The answer is streamed token by token. Without these three the
        # response is buffered and the user waits for the whole thing, which
        # defeats the point of streaming.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # A cold question runs classification, embedding, retrieval, SQL
        # generation and execution before the first token, and the backend
        # already caps queries at 30s. Allow more than nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
