name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Allow running by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches .python-version and the Dockerfile
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No .env, no AWS credentials and no database are available here, and the
      # suite is written to need none of them - every external call is stubbed.
      # If a test starts requiring real infrastructure, it fails here rather
      # than passing silently on a developer machine that happens to have .env.
      #
      # pyproject.toml sets addopts = "-m 'not eval'", so the evals/ suite
      # (which calls real Bedrock models) is excluded. Run those deliberately
      # with `pytest -m eval`.
      - name: Run tests
        run: pytest tests/ -q

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only worth the minutes once the tests pass.
    needs: pytest

    steps:
      - uses: actions/checkout@v4

      # Builds the image without pushing, so a broken Dockerfile or a missing
      # dependency is caught here instead of during a manual dockerbuild.sh.
      - name: Build image
        run: docker build -t convai-app:ci .

      - name: Verify the app starts and reports liveness
        run: |
          docker run -d --name convai-ci -p 8000:8000 convai-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/convai/health > /dev/null 2>&1; then
              echo "liveness OK"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy"; docker logs convai-ci; exit 1

      - name: Stop container
        if: always()
        run: docker rm -f convai-ci || true
